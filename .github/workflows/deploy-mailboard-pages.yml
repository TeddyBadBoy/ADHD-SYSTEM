name: Deploy ADHD MailBoard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/mailboard/**'
      - '.github/workflows/deploy-mailboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload MailBoard artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mailboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
