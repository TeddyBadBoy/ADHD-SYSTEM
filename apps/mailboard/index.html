<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHD MailBoard</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--card:#1f2937;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--danger:#ef4444;--warn:#f59e0b;--accent:#3b82f6;--ok:#10b981}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}header{padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0f172af2;z-index:5}h1{margin:0;font-size:22px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,input,select{font:inherit}button{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#1e293b;color:var(--text);cursor:pointer}button.primary{background:#60a5fa;color:#0f172a;font-weight:700;border:0}main{padding:14px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.alerts{background:#2b1117;border:1px solid #7f1d1d;border-radius:14px;padding:12px;margin-bottom:12px}.alerts h2{font-size:15px;margin:0 0 8px}.alert-list{display:flex;gap:8px;overflow:auto}.alarm{min-width:230px;background:#3b161f;border:1px solid #7f1d1d;border-radius:10px;padding:9px}.alarm .reason{font-size:12px;color:#fca5a5;margin-top:4px}.board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:10px;overflow:auto}.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:430px}.col h2{font-size:15px;margin:0;padding:12px;border-bottom:1px solid var(--line)}.cards{padding:10px;display:grid;gap:9px}.card{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:grab}.card.critical{background:linear-gradient(135deg,#4c141d,#2a1820);box-shadow:0 0 0 2px var(--danger) inset}.card.high{background:linear-gradient(135deg,#4c2c12,#2a2018);box-shadow:0 0 0 2px var(--warn) inset}.card.normal{background:linear-gradient(135deg,#15345b,#1c2639);box-shadow:0 0 0 2px var(--accent) inset}.card.low{background:linear-gradient(135deg,#123c34,#1b2d2a);box-shadow:0 0 0 2px var(--ok) inset}.card.overdue{outline:2px solid var(--danger)}.title{font-weight:700}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:#cbd5e1}.danger{color:#fecaca;border-color:#7f1d1d}.empty{color:var(--muted);font-size:13px;padding:16px;text-align:center}dialog{width:min(520px,calc(100vw - 24px));border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text)}form{display:grid;gap:10px}label{display:grid;gap:5px;font-size:12px;color:var(--muted)}input,select{padding:9px;border-radius:9px;border:1px solid var(--line);background:#0f172a;color:var(--text)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:8px;color:var(--text)}.check input{width:auto}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}@media(max-width:900px){.summary{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(4,85vw)}}
</style>
</head>
<body>
<header>
<h1>ADHD MailBoard</h1>
<div class="sub">Taskboard + Quick Add + Pilność + HeatMap + Alarmy ADHD</div>
<div class="toolbar"><button class="primary" id="addBtn">+ Zadanie</button><button id="clearBtn">Wyczyść</button></div>
</header>
<main>
<section class="summary">
<div class="stat"><b id="sTodo">0</b><span>Do zrobienia</span></div>
<div class="stat"><b id="sCritical">0</b><span>Krytyczne</span></div>
<div class="stat"><b id="sToday">0</b><span>Termin dziś</span></div>
<div class="stat"><b id="sOverdue">0</b><span>Po terminie</span></div>
</section>
<section class="alerts">
<h2>🔴 Alarmy ADHD</h2>
<div id="alerts" class="alert-list"></div>
</section>
<section id="board" class="board"></section>
</main>
<dialog id="dlg">
<form id="form" method="dialog">
<h3 style="margin:0">Quick Add</h3>
<label>Tytuł<input id="title" required placeholder="Co trzeba zrobić?"></label>
<div class="row">
<label>Pilność<select id="urgency"><option value="critical">Krytyczna</option><option value="high">Wysoka</option><option value="normal" selected>Normalna</option><option value="low">Niska</option></select></label>
<label>Termin<input id="due" type="date"></label>
</div>
<label>Epik / projekt<input id="epic" placeholder="opcjonalnie"></label>
<label class="check"><input id="redFlag" type="checkbox"> Oznacz na czerwono</label>
<div class="actions"><button type="button" id="cancel">Anuluj</button><button class="primary" type="submit">Zapisz</button></div>
</form>
</dialog>
<script>
const KEY='adhd-mailboard-v1';
const cols=[['backlog','Backlog'],['todo','Do zrobienia'],['progress','W toku'],['done','Gotowe']];
const names={critical:'Krytyczna',high:'Wysoka',normal:'Normalna',low:'Niska'};
const rank={critical:4,high:3,normal:2,low:1};
let tasks=JSON.parse(localStorage.getItem(KEY)||'[]').map(t=>({redFlag:false,...t}));
const $=id=>document.getElementById(id);
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function isOverdue(t){return t.due&&t.due<today()&&t.status!=='done'}
function isToday(t){return t.due===today()&&t.status!=='done'}
function alarmReasons(t){const r=[];if(t.redFlag&&t.status!=='done')r.push('czerwone');if(isOverdue(t))r.push('po terminie');if(isToday(t))r.push('termin dziś');return r}
function sorted(key){return tasks.filter(t=>t.status===key).sort((a,b)=>{if(key==='todo'){const u=rank[b.urgency]-rank[a.urgency];if(u)return u}return (a.due||'9999-99-99').localeCompare(b.due||'9999-99-99')})}
function render(){
 $('board').innerHTML=cols.map(([key,label])=>{const list=sorted(key);return `<section class="col" data-status="${key}"><h2>${label} (${list.length})</h2><div class="cards">${list.length?list.map(card).join(''):'<div class="empty">Brak zadań</div>'}</div></section>`}).join('');
 const alarms=tasks.filter(t=>alarmReasons(t).length).sort((a,b)=>rank[b.urgency]-rank[a.urgency]);
 $('alerts').innerHTML=alarms.length?alarms.map(t=>`<div class="alarm"><b>${esc(t.title)}</b><div class="reason">${alarmReasons(t).join(' · ')}</div></div>`).join(''):'<div class="empty">Brak alarmów</div>';
 $('sTodo').textContent=tasks.filter(t=>t.status==='todo').length;
 $('sCritical').textContent=tasks.filter(t=>t.urgency==='critical'&&t.status!=='done').length;
 $('sToday').textContent=tasks.filter(isToday).length;
 $('sOverdue').textContent=tasks.filter(isOverdue).length;
 document.querySelectorAll('.card').forEach(c=>c.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',c.dataset.id)));
 document.querySelectorAll('.col').forEach(c=>{c.addEventListener('dragover',e=>e.preventDefault());c.addEventListener('drop',e=>{e.preventDefault();const t=tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t){t.status=c.dataset.status;save()}})});
}
function card(t){const overdue=isOverdue(t)?' overdue':'';return `<article class="card ${t.urgency}${overdue}" draggable="true" data-id="${t.id}"><div class="title">${esc(t.title)}</div><div class="meta"><span class="pill">${names[t.urgency]}</span>${t.due?`<span class="pill">📅 ${t.due}</span>`:''}${t.epic?`<span class="pill">📁 ${esc(t.epic)}</span>`:''}${t.redFlag?'<span class="pill">🔴 alarm</span>':''}</div><div class="meta"><button class="danger" onclick="removeTask('${t.id}')">Usuń</button></div></article>`}
function removeTask(id){tasks=tasks.filter(t=>t.id!==id);save()}
$('addBtn').onclick=()=>{$('form').reset();$('urgency').value='normal';$('dlg').showModal()};
$('cancel').onclick=()=>$('dlg').close();
$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,status:'backlog',urgency:$('urgency').value,due:$('due').value,epic:$('epic').value.trim(),redFlag:$('redFlag').checked});$('dlg').close();save()};
$('clearBtn').onclick=()=>{if(confirm('Wyczyścić wszystkie zadania?')){tasks=[];save()}};
render();
</script>
</body>
</html>
