<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>ADHD MailBoard</title>
<style>
:root{
  --bg:#08111f;--panel:#0d1728;--panel2:#111e32;--card:#132238;--line:#24364f;
  --text:#f4f7fb;--muted:#8fa2bb;--accent:#63a8ff;--accent2:#b8d8ff;
  --danger:#ff5d6c;--warn:#ffb84d;--ok:#3dd598;--low:#65d0b3;--shadow:0 12px 32px rgba(0,0,0,.24)
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{width:min(1480px,100%);margin:auto;padding:0 16px 32px}
.topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:14px 16px 12px;background:rgba(8,17,31,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(143,162,187,.16)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--accent);color:#07101d;font-weight:900;box-shadow:0 8px 22px rgba(99,168,255,.22)}
h1{font-size:20px;line-height:1.05;margin:0;letter-spacing:-.02em}
.subtitle{margin-top:4px;color:var(--muted);font-size:12px}
.badge{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--accent2);padding:6px 9px;border-radius:999px;font-size:11px}
.toolbar{display:flex;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);min-height:42px;padding:0 14px;border-radius:12px;font-weight:700}
.btn.primary{border-color:transparent;background:var(--accent);color:#07101d}
.btn.ghost{color:var(--muted)}
.btn.danger{color:#ffb0b7;border-color:#5d2732;background:#24131a}
.main{padding-top:14px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:13px 14px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.stat b{display:block;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:7px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.alarm b{color:#ff9aa5}.stat.today b{color:#ffd18b}
.alerts{margin-top:12px;border:1px solid #552631;background:#21131a;border-radius:16px;padding:12px 14px}
.alert-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.alert-title{font-size:13px;font-weight:800;color:#ffc0c6}
.alert-count{min-width:28px;height:28px;padding:0 8px;display:grid;place-items:center;border-radius:999px;background:#3a1720;color:#ffb0b7;font-size:12px;font-weight:800}
.alert-list{display:flex;gap:8px;overflow:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none}.alert-list::-webkit-scrollbar{display:none}
.alarm-card{min-width:220px;max-width:320px;border:1px solid #5a2732;background:#2a161e;border-radius:12px;padding:10px}
.alarm-card b{font-size:13px}.reason{margin-top:4px;color:#ff9fac;font-size:11px}
.no-alerts{color:var(--muted);font-size:12px;margin-top:6px}
.tabs{display:none;gap:8px;overflow:auto;margin:14px -16px 10px;padding:0 16px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800}
.tab.active{background:var(--accent);color:#07101d;border-color:transparent}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;margin-top:14px}
.col{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden;min-height:420px}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px;border-bottom:1px solid var(--line);background:rgba(17,30,50,.55)}
.col-title{font-size:13px;font-weight:900}.count{min-width:26px;height:26px;padding:0 7px;display:grid;place-items:center;border-radius:999px;background:#182941;color:var(--accent2);font-size:11px;font-weight:900}
.cards{display:grid;gap:10px;padding:10px}
.empty{display:grid;place-items:center;min-height:120px;color:var(--muted);font-size:12px;border:1px dashed rgba(143,162,187,.22);border-radius:13px}
.card{position:relative;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:12px;box-shadow:0 7px 18px rgba(0,0,0,.12);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.card.critical::before{background:var(--danger)}.card.high::before{background:var(--warn)}.card.low::before{background:var(--low)}
.card.overdue{border-color:#71303a;box-shadow:0 0 0 1px rgba(255,93,108,.3),0 7px 18px rgba(0,0,0,.12)}
.card-title{font-size:15px;font-weight:850;line-height:1.3;padding-right:4px;word-break:break-word}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pill{max-width:100%;font-size:10px;color:#b9c7d8;border:1px solid #2f4562;background:#0d1b2d;border-radius:999px;padding:4px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.critical{color:#ffb3bb;border-color:#6e2d38}.pill.high{color:#ffd19a;border-color:#624321}.pill.red{color:#ffafb8;border-color:#6e2d38}
.card-actions{display:flex;align-items:center;gap:7px;margin-top:11px}
.status-select{min-width:0;flex:1;height:38px;border:1px solid var(--line);border-radius:10px;background:#0b1829;color:var(--text);padding:0 9px;font-size:11px;font-weight:750}
.icon-btn{width:38px;height:38px;border:1px solid #57303a;border-radius:10px;background:#25151b;color:#ff9eaa;font-size:17px}
dialog{width:min(520px,calc(100vw - 24px));border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);padding:0;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(2,8,17,.72);backdrop-filter:blur(3px)}
.form{display:grid;gap:12px;padding:18px}.form h2{font-size:18px;margin:0}.form-sub{margin-top:-6px;color:var(--muted);font-size:11px}
label{display:grid;gap:6px;color:var(--muted);font-size:11px;font-weight:700}
input,select.form-control{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:#0a1626;color:var(--text);padding:0 11px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:12px}.check input{width:18px;height:18px}
.form-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:4px}
.hint{margin-top:10px;text-align:center;color:var(--muted);font-size:10px}
@media(max-width:900px){
  .app{padding:0 12px 24px}.topbar{margin:0 -12px;padding:12px}.summary{grid-template-columns:1fr 1fr}.stat{padding:12px}.stat b{font-size:24px}
  .tabs{display:flex}.board{display:block;margin-top:0}.col{display:none;min-height:360px}.col.active{display:block}.cards{padding:9px}.card{padding:12px}
  .toolbar .btn{flex:1}.toolbar .ghost{flex:0 0 auto;padding:0 12px}.alerts{margin-top:10px}
}
@media(max-width:560px){
  .subtitle{max-width:245px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:none}.logo{width:36px;height:36px}.topbar{padding-top:max(12px,env(safe-area-inset-top))}
  dialog{position:fixed;left:0;right:0;bottom:0;width:100%;max-width:none;margin:0;border-radius:22px 22px 0 0;border-bottom:0}.row{grid-template-columns:1fr}.form{padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brandrow">
    <div class="brand"><div class="logo">M</div><div><h1>MailBoard</h1><div class="subtitle">ADHD OS · szybki inbox zadań</div></div></div>
    <div class="badge" id="criticalBadge">0 krytycznych</div>
  </div>
  <div class="toolbar"><button class="btn primary" id="addBtn">+ Dodaj do Backlogu</button><button class="btn ghost" id="clearBtn" title="Wyczyść wszystko">Wyczyść</button></div>
</header>

<main class="main">
  <section class="summary">
    <div class="stat"><b id="sBacklog">0</b><span>Backlog</span></div>
    <div class="stat"><b id="sTodo">0</b><span>Do zrobienia</span></div>
    <div class="stat today"><b id="sToday">0</b><span>Termin dziś</span></div>
    <div class="stat alarm"><b id="sOverdue">0</b><span>Po terminie</span></div>
  </section>

  <section class="alerts">
    <div class="alert-head"><div class="alert-title">Alarmy ADHD</div><div class="alert-count" id="alarmCount">0</div></div>
    <div id="alerts" class="alert-list"></div>
  </section>

  <nav id="tabs" class="tabs" aria-label="Statusy zadań"></nav>
  <section id="board" class="board"></section>
  <div class="hint">Na telefonie zmieniaj status z listy na karcie. Na komputerze działa też drag & drop.</div>
</main>
</div>

<dialog id="dlg">
<form id="form" class="form" method="dialog">
  <h2>Nowe zadanie</h2>
  <div class="form-sub">Po zapisaniu trafia domyślnie do Backlogu.</div>
  <label>Tytuł<input id="title" class="form-control" required autocomplete="off" placeholder="Co trzeba zrobić?"></label>
  <div class="row">
    <label>Pilność<select id="urgency" class="form-control"><option value="critical">Krytyczna</option><option value="high">Wysoka</option><option value="normal" selected>Normalna</option><option value="low">Niska</option></select></label>
    <label>Termin<input id="due" class="form-control" type="date"></label>
  </div>
  <label>Projekt / Epic<input id="epic" class="form-control" autocomplete="off" placeholder="opcjonalnie"></label>
  <label class="check"><input id="redFlag" type="checkbox"> Czerwony alarm</label>
  <div class="form-actions"><button class="btn" type="button" id="cancel">Anuluj</button><button class="btn primary" type="submit">Zapisz do Backlogu</button></div>
</form>
</dialog>

<script>
const KEY='adhd-mailboard-v1';
const cols=[['backlog','Backlog'],['todo','Do zrobienia'],['progress','W toku'],['done','Gotowe']];
const names={critical:'Krytyczna',high:'Wysoka',normal:'Normalna',low:'Niska'};
const rank={critical:4,high:3,normal:2,low:1};
let activeColumn='backlog';
let tasks=JSON.parse(localStorage.getItem(KEY)||'[]').map(t=>({redFlag:false,status:'backlog',...t}));
const $=id=>document.getElementById(id);
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function isOverdue(t){return t.due&&t.due<today()&&t.status!=='done'}
function isToday(t){return t.due===today()&&t.status!=='done'}
function alarmReasons(t){const r=[];if(t.redFlag&&t.status!=='done')r.push('czerwone');if(isOverdue(t))r.push('po terminie');if(isToday(t))r.push('termin dziś');return r}
function sorted(key){return tasks.filter(t=>t.status===key).sort((a,b)=>{const u=rank[b.urgency]-rank[a.urgency];if(u)return u;return (a.due||'9999-99-99').localeCompare(b.due||'9999-99-99')})}
function setStatus(id,status){const t=tasks.find(x=>x.id===id);if(!t)return;t.status=status;activeColumn=status;save()}
function removeTask(id){tasks=tasks.filter(t=>t.id!==id);save()}
function statusOptions(current){return cols.map(([key,label])=>`<option value="${key}"${key===current?' selected':''}>${label}</option>`).join('')}
function card(t){
  const overdue=isOverdue(t)?' overdue':'';
  const urgencyClass=t.urgency==='critical'?' critical':t.urgency==='high'?' high':'';
  return `<article class="card ${t.urgency}${overdue}" draggable="true" data-id="${t.id}">
    <div class="card-title">${esc(t.title)}</div>
    <div class="meta"><span class="pill${urgencyClass}">${names[t.urgency]}</span>${t.due?`<span class="pill">${isToday(t)?'Dziś':'Termin'}: ${t.due}</span>`:''}${t.epic?`<span class="pill">${esc(t.epic)}</span>`:''}${t.redFlag?'<span class="pill red">Alarm</span>':''}</div>
    <div class="card-actions"><select class="status-select" aria-label="Status zadania" onchange="setStatus('${t.id}',this.value)">${statusOptions(t.status)}</select><button class="icon-btn" type="button" aria-label="Usuń" onclick="removeTask('${t.id}')">×</button></div>
  </article>`
}
function render(){
  $('tabs').innerHTML=cols.map(([key,label])=>`<button class="tab${activeColumn===key?' active':''}" data-tab="${key}">${label} · ${tasks.filter(t=>t.status===key).length}</button>`).join('');
  $('board').innerHTML=cols.map(([key,label])=>{const list=sorted(key);return `<section class="col${activeColumn===key?' active':''}" data-status="${key}"><div class="col-head"><div class="col-title">${label}</div><div class="count">${list.length}</div></div><div class="cards">${list.length?list.map(card).join(''):'<div class="empty">Brak zadań</div>'}</div></section>`}).join('');
  const alarms=tasks.filter(t=>alarmReasons(t).length).sort((a,b)=>rank[b.urgency]-rank[a.urgency]);
  $('alarmCount').textContent=alarms.length;
  $('alerts').innerHTML=alarms.length?alarms.map(t=>`<div class="alarm-card"><b>${esc(t.title)}</b><div class="reason">${alarmReasons(t).join(' · ')}</div></div>`).join(''):'<div class="no-alerts">Brak alarmów. Nic nie wymaga natychmiastowej reakcji.</div>';
  $('sBacklog').textContent=tasks.filter(t=>t.status==='backlog').length;
  $('sTodo').textContent=tasks.filter(t=>t.status==='todo').length;
  $('sToday').textContent=tasks.filter(isToday).length;
  $('sOverdue').textContent=tasks.filter(isOverdue).length;
  const critical=tasks.filter(t=>t.urgency==='critical'&&t.status!=='done').length;
  $('criticalBadge').textContent=`${critical} ${critical===1?'krytyczne':'krytycznych'}`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeColumn=b.dataset.tab;render()});
  document.querySelectorAll('.card').forEach(c=>c.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',c.dataset.id)));
  document.querySelectorAll('.col').forEach(c=>{c.addEventListener('dragover',e=>e.preventDefault());c.addEventListener('drop',e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');setStatus(id,c.dataset.status)})});
}
$('addBtn').onclick=()=>{$('form').reset();$('urgency').value='normal';$('dlg').showModal();setTimeout(()=>$('title').focus(),50)};
$('cancel').onclick=()=>$('dlg').close();
$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,status:'backlog',urgency:$('urgency').value,due:$('due').value,epic:$('epic').value.trim(),redFlag:$('redFlag').checked});activeColumn='backlog';$('dlg').close();save()};
$('clearBtn').onclick=()=>{if(confirm('Wyczyścić wszystkie zadania?')){tasks=[];activeColumn='backlog';save()}};
render();
</script>
</body>
</html>
