<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHD MailBoard</title>
</head>
<body>
<h1>ADHD MailBoard</h1>

<button onclick="addTask()">+ Zadanie</button>

<div id="tasks"></div>

<script>
function addTask() {
  const title = prompt("Tytuł zadania");
  if (!title) return;

  const div = document.createElement("div");
  div.innerHTML = "📌 " + title;

  document.getElementById("tasks").appendChild(div);
}
</script>
</body>
</html>
